[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litecraft-launcher"
version = "0.1.0"
description = "A small command-line Minecraft launcher with offline profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["minecraft-launcher-lib>=7.1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
litecraft = "litecraft_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
